<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | NovaRise Academy</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#eef0ff,#f8f7ff);
}

.login-box{
    width:100%;
    max-width:430px;
    background:#fff;
    padding:32px;
    border-radius:25px;
    box-shadow:0 15px 45px rgba(0,0,0,.10);
}

.logo{
    width:70px;
    height:70px;
    margin:0 auto 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:20px;
    background:linear-gradient(135deg,#5b3df5,#8b5cf6);
    color:#fff;
    font-size:32px;
}

h1{
    text-align:center;
    margin:0 0 8px;
    color:#202040;
    font-size:26px;
}

.subtitle{
    text-align:center;
    color:#888;
    font-size:13px;
    margin-bottom:28px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#444;
    font-size:13px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:14px;
    margin-bottom:18px;
}

input:focus{
    border-color:#6548ee;
}

.login-btn{
    width:100%;
    padding:15px;
    border:0;
    border-radius:13px;
    background:linear-gradient(135deg,#5b3df5,#8b5cf6);
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    opacity:.9;
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-size:12px;
}

.error{
    background:#ffecec;
    color:#c53030;
}

.security{
    margin-top:20px;
    padding:13px;
    border-radius:12px;
    background:#f5f3ff;
    color:#5945ae;
    font-size:11px;
    line-height:1.5;
    text-align:center;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#5b3df5;
    text-decoration:none;
    font-size:13px;
}

@media(max-width:480px){
    .login-box{
        padding:25px 20px;
    }
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        🛡️
    </div>

    <h1>Admin Login</h1>

    <div class="subtitle">
        NovaRise Academy Administration
    </div>

    <form id="adminLoginForm">

        <label for="adminEmail">
            Admin Email
        </label>

        <input
            type="email"
            id="adminEmail"
            placeholder="Enter admin email"
            autocomplete="username"
            required
        >

        <label for="adminPassword">
            Password
        </label>

        <input
            type="password"
            id="adminPassword"
            placeholder="Enter password"
            autocomplete="current-password"
            required
        >

        <button
            type="submit"
            class="login-btn">
            🔐 Sign In
        </button>

        <div id="loginError" class="message error">
            Invalid Admin Email or Password.
        </div>

    </form>

    <div class="security">
        🔒 This is currently a prototype login.
        Real production authentication must be handled securely
        on a backend server.
    </div>

    <a href="member.html" class="back">
        ← Back to Member Portal
    </a>

</div>


<script>
const ADMIN_EMAIL = "admin@novariseacademy.com";
const ADMIN_PASSWORD = "Admin@12345";

document
.getElementById("adminLoginForm")
.addEventListener("submit", function(event){

    event.preventDefault();

    const email =
        document.getElementById("adminEmail")
        .value
        .trim();

    const password =
        document.getElementById("adminPassword")
        .value;

    const error =
        document.getElementById("loginError");

    if(
        email === ADMIN_EMAIL &&
        password === ADMIN_PASSWORD
    ){

        localStorage.setItem(
            "novaAdminLoggedIn",
            "true"
        );

        window.location.href =
            "admin.html";

    }else{

        error.style.display = "block";

    }

});
</script>

</body>
</html>
